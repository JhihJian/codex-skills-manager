<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skills 问题审查</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5" />
        <path d="m12 19-7-7 7-7" />
      </symbol>
      <symbol id="icon-shield-alert" viewBox="0 0 24 24">
        <path d="M12 3 20 6v6c0 5-3.2 7.7-8 9-4.8-1.3-8-4-8-9V6l8-3Z" />
        <path d="M12 8v5" />
        <path d="M12 17h.01" />
      </symbol>
    </svg>
    <div class="window review-window">
      <header class="titlebar">
        <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="title">
          <strong>Skills 问题审查</strong>
          <span id="reviewPageStatus">准备就绪</span>
        </div>
        <div class="toolbar">
          <a class="icon-button" href="/" title="返回技能管理" aria-label="返回技能管理"><svg><use href="#icon-arrow-left"></use></svg></a>
        </div>
      </header>

      <main class="review-shell">
        <aside class="review-nav" aria-label="审查类型">
          <div class="review-nav-head">
            <span>审查项</span>
            <strong id="reviewTypeCount">1</strong>
          </div>
          <button class="review-type active" type="button" data-review="usage">
            <svg aria-hidden="true"><use href="#icon-shield-alert"></use></svg>
            <span>
              <strong>长期未真实使用</strong>
              <small>基于真实 SKILL.md 读取证据</small>
            </span>
          </button>
        </aside>

        <section class="review-workspace" aria-live="polite">
          <div class="review-page-head">
            <div>
              <h1 id="reviewTitle">长期未真实使用</h1>
              <p id="reviewDescription">识别长期没有真实触发证据的 skills，避免把会话技能列表或普通关键词命中误判为使用。</p>
            </div>
            <button id="runReviewButton" class="primary-button">开始审查</button>
          </div>

          <div class="review-controls review-controls-page">
            <label>
              <span>长期未用阈值</span>
              <input id="reviewStaleDays" type="number" min="1" max="3650" value="30" />
            </label>
            <label>
              <span>审查范围</span>
              <select id="reviewScope">
                <option value="enabled">已启用</option>
                <option value="managed">项目库纳管</option>
                <option value="all">全部</option>
              </select>
            </label>
            <label class="checkbox-label">
              <input id="reviewIncludeSystem" type="checkbox" checked />
              <span>包含系统技能</span>
            </label>
          </div>

          <div class="review-summary" id="reviewSummary">
            <span>尚未运行审查</span>
          </div>
          <div class="review-progress" id="reviewProgress" role="progressbar" aria-label="技能审查进度" aria-valuemin="0" aria-valuemax="100" hidden>
            <span></span>
          </div>
          <div class="review-policy" id="reviewPolicy"></div>
          <div class="review-results review-results-page" id="reviewResults"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="statusText">准备就绪</span>
        <span id="updatedAt"></span>
      </footer>
    </div>
    <script src="/reviews.js" type="module"></script>
  </body>
</html>
