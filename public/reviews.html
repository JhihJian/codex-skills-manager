<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>技能结果评审</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.3 6.4M3 12A9 9 0 0 1 18.3 5.6"/><path d="M21 4v6h-6M3 20v-6h6"/></symbol>
      <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r=".5"/><circle cx="3.5" cy="12" r=".5"/><circle cx="3.5" cy="18" r=".5"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/></symbol>
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-5M12 16V7M16 16v-3"/></symbol>
      <symbol id="icon-message-alert" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M12 7v4M12 15h.01"/></symbol>
    </svg>
    <div class="window review-window outcome-window">
      <header class="titlebar">
        <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="title"><strong>技能结果评审</strong><span id="reviewPageStatus">准备就绪</span></div>
        <div class="toolbar">
          <button id="effectScanButton" class="icon-button icon-button-labeled" title="增量扫描会话" aria-label="增量扫描会话"><svg><use href="#icon-refresh"></use></svg><span>扫描</span></button>
          <a class="icon-button" href="/" title="返回技能管理" aria-label="返回技能管理"><svg><use href="#icon-arrow-left"></use></svg></a>
        </div>
      </header>
      <main class="outcome-shell">
        <aside class="outcome-nav" aria-label="结果评审视图">
          <div class="review-nav-head"><span>评审</span><strong id="openQueueCount">0</strong></div>
          <button class="review-type active" data-view="quality"><svg><use href="#icon-chart"></use></svg><span><strong>技能质量</strong><small>版本、证据与试用判断</small></span></button>
          <button class="review-type" data-view="loads"><svg><use href="#icon-list"></use></svg><span><strong>加载检测</strong><small>Codex 与 Pi 加载记录</small></span></button>
          <button class="review-type" data-view="outcomes"><svg><use href="#icon-check"></use></svg><span><strong>任务结果</strong><small>合同证据与结论</small></span></button>
          <button class="review-type" data-view="feedback"><svg><use href="#icon-message-alert"></use></svg><span><strong>负面反馈</strong><small>用户评价与过程异常</small></span></button>
          <button class="review-type" data-view="queue"><svg><use href="#icon-list"></use></svg><span><strong>人工队列</strong><small>冲突、缺证据与校准</small></span></button>
          <button class="review-type" data-view="contracts"><svg><use href="#icon-file"></use></svg><span><strong>合同</strong><small>草稿、预览与发布</small></span></button>
          <button class="review-type" data-view="metrics"><svg><use href="#icon-chart"></use></svg><span><strong>指标</strong><small>分母、覆盖与快照</small></span></button>
          <span class="outcome-nav-hint" aria-hidden="true">→</span>
        </aside>
        <section class="outcome-workspace" aria-live="polite">
          <div class="outcome-overview" id="effectOverview"></div>
          <div id="outcomeContent" class="outcome-content"></div>
        </section>
      </main>
      <footer class="statusbar"><span id="statusText">准备就绪</span><span id="updatedAt"></span></footer>
    </div>
    <script src="/auth.js"></script>
    <script src="/reviews.js" type="module"></script>
  </body>
</html>
